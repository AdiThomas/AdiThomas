    <text x="24" y="88" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#eef1f4">Self-hosted photo &amp; file cloud on a Raspberry Pi 5,</text>
    <text x="24" y="111" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#eef1f4">with its own iPhone app for camera-roll backup.</text>
    <text x="24" y="142" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="13" fill="#8b95a1">› Tailscale only · zero open router ports</text>
    <rect x="24" y="162" width="73" height="26" rx="4" fill="#1a1f26" stroke="#262d36"/><text x="60.5" y="179.5" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#eef1f4">FastAPI</text><rect x="105" y="162" width="111" height="26" rx="4" fill="#1a1f26" stroke="#262d36"/><text x="160.5" y="179.5" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#eef1f4">React Native</text><rect x="224" y="162" width="81" height="26" rx="4" fill="#1a1f26" stroke="#262d36"/><text x="264.5" y="179.5" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#eef1f4">Postgres</text><rect x="313" y="162" width="73" height="26" rx="4" fill="#1a1f26" stroke="#262d36"/><text x="349.5" y="179.5" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="12" fill="#eef1f4">Ansible</text>
