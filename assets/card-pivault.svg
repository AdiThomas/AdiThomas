<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="PiVault: Self-hosted photo &amp; file cloud on a Raspberry Pi 5, with its own iPhone app for camera-roll backup.">
  <defs><clipPath id="r"><rect width="600" height="210" rx="12"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="600" height="210" fill="#13171c"/>
    <rect width="600" height="210" rx="12" fill="none" stroke="#262d36" stroke-width="2"/>
    <rect width="6" height="210" fill="#ff5a36"/>
    <text x="24" y="50" font-family="'Bahnschrift','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" font-style="italic" fill="#ff5a36">P2</text>
    <text x="74" y="49" font-family="'Bahnschrift','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="#eef1f4">PiVault</text>
    <rect x="526" y="26" width="50" height="26" rx="13" fill="none" stroke="#ffd23f"/>
